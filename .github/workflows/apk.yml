# 자린고비(그룹) 안드로이드 APK를 GitHub에서 자동으로 만들어요.
# 이 파일을 고치거나 Actions 탭에서 'Run workflow'를 누르면 새로 만들어져요.
# 완성된 APK는 저장소의 Releases → 'apk-latest'에서 받을 수 있어요.
# 앱은 https://jaringobi-group.vercel.app 을 그대로 보여 주는 껍데기라서, 웹을 고치면 앱도 따라 바뀌어요.
name: APK 만들기
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 안드로이드 프로젝트 만들기
        run: |
          mkdir -p android/app/src/main/java/app/jaringobi android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cd android
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "jaringobi"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'app.jaringobi'
            compileSdk 34
            defaultConfig {
              applicationId 'app.jaringobi.group'
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher"
                android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">자린고비</string></resources>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/white" />
            <foreground android:drawable="@drawable/ic_fish" />
          </adaptive-icon>
          EOF
          cat > app/src/main/res/drawable/ic_fish.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:strokeColor="#111111" android:strokeWidth="4" android:strokeLineJoin="round"
                android:pathData="M30,54 C40,38 66,38 76,54 C66,70 40,70 30,54 Z M76,54 L90,42 L90,66 Z" />
            <path android:fillColor="#111111" android:pathData="M37,51 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0 Z" />
          </vector>
          EOF
          cat > app/src/main/java/app/jaringobi/MainActivity.java <<'EOF'
          package app.jaringobi;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            static final String HOST = "jaringobi-group.vercel.app";
            static final int PICK = 1;
            WebView web;
            ValueCallback<Uri[]> pending;

            @Override protected void onCreate(Bundle saved) {
              super.onCreate(saved);
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);              // 기록(localStorage) 저장
              s.setMediaPlaybackRequiresUserGesture(false); // 응원 목소리
              web.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if (HOST.equals(u.getHost())) return false;  // 앱 안에서 열기
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                  return true;                                 // 쿠팡·금감원 링크는 브라우저로
                }
              });
              web.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (pending != null) pending.onReceiveValue(null);
                  pending = cb;
                  try { startActivityForResult(p.createIntent(), PICK); }
                  catch (Exception e) { pending = null; return false; }
                  return true;                                 // 굴비 사진 올리기
                }
              });
              if (saved != null) web.restoreState(saved);
              else web.loadUrl("https://" + HOST + "/");
            }

            @Override protected void onActivityResult(int req, int res, Intent data) {
              if (req == PICK && pending != null) {
                pending.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                pending = null;
              } else super.onActivityResult(req, res, data);
            }

            @Override public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }

            @Override protected void onSaveInstanceState(Bundle out) {
              super.onSaveInstanceState(out);
              web.saveState(out);
            }
          }
          EOF
      - name: APK 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk jaringobi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jaringobi-apk
          path: jaringobi.apk
      - name: 다운로드 링크 만들기 (Releases → apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create apk-latest jaringobi.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "자린고비 APK" --notes "안드로이드 폰에서 jaringobi.apk를 받아 설치하세요. 처음 설치할 때 '출처를 알 수 없는 앱 설치'를 허용해야 해요. 앱은 https://jaringobi-group.vercel.app 을 그대로 보여 줘요."
